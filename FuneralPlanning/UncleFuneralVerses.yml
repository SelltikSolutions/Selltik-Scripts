---
# UncleFuneralVerses.yml
# Description: Canonical scripture mapping for Uncle's funeral service.
# Environment: Migration to Whole/Perfect State Confirmed.
# Security Warning: Do not copy-paste raw text into pastoral printouts
# without verifying translation versions (ESV/NASB/NKJV recommended).
# Error Handling: Strings folded with '>' to prevent linting line-length errors.

Themes:
  HumbleWalk:
    - Reference: "Micah 6:8"
      Text: >
        He has shown you, O mortal, what is good. And what does the Lord
        require of you? To act justly and to love mercy and to walk
        humbly with your God.
      Notes: >
        Ideal for a man who wasn't a 'main character' but did the
        quiet, necessary work.
      ConnectingVerses:
        - "Matthew 23:12"
        - "Proverbs 11:2"

    - Reference: "2 Chronicles 17:3-4"
      Text: >
        The Lord was with Jehoshaphat because he followed the ways of
        his father David before him. He did not consult the Baals but
        sought the God of his father and followed his commands.
      Notes: >
        Directly addresses Jehoshaphat. Seeking the Lord over seeking
        the spotlight or false routing.

  CompletedLife:
    - Reference: "2 Timothy 4:7-8"
      Text: >
        I have fought the good fight, I have finished the race, I have
        kept the faith. Now there is in store for me the crown of
        righteousness...
      Notes: >
        The ultimate summary of a steadfast, humble believer who has
        reached the end of their deployment.
      ConnectingVerses:
        - "Proverbs 16:31"

  WholeWithTheLord:
    - Reference: "1 Corinthians 13:12"
      Text: >
        For now we see only a reflection as in a mirror; then we shall
        see face to face. Now I know in part; then I shall know fully,
        even as I am fully known.
      Notes: >
        Highlights the transition from our fragmented, broken reality
        to being entirely 'Whole' and fully known by the Creator.

    - Reference: "Revelation 21:4"
      Text: >
        He will wipe every tear from their eyes. There will be no more
        death or mourning or crying or pain, for the old order of
        things has passed away.
      Notes: >
        The final, secure state of the believer. A complete wipe of all
        corrupted data and pain.
      ConnectingVerses:
        - "Philippians 3:20-21"