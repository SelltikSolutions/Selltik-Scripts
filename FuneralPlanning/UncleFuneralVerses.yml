---
# UncleFuneralVerses.yml
# Description: Tailored scripture mapping for Uncle's funeral service.
# Environment: Migration to Whole/Perfect State Confirmed.
# Security Warning: Do not copy-paste raw text into pastoral printouts
# without verifying translation versions (ESV/NASB/NKJV recommended).
# Error Handling: Strings folded with '>' to prevent linting line-length errors.

Themes:
  ReconAndVerification:
    - Reference: "Proverbs 25:2"
      Text: >
        It is the glory of God to conceal a matter; to search out a
        matter is the glory of kings.
      Notes: >
        Aligns with his counter-intel background and his protocol of
        gathering first-hand intel on new locations. He did not rely
        on second-hand data or unverified reports.
      ConnectingVerses:
        - "1 Thessalonians 5:21"

  QuietProfessional:
    - Reference: "1 Thessalonians 4:11"
      Text: >
        ...and to make it your ambition to lead a quiet life: You
        should mind your own business and work with your hands, just
        as we told you...
      Notes: >
        Perfect for a veteran who kept his operational history
        classified and lived humbly without demanding the spotlight.

  TacticalReadiness:
    - Reference: "Psalm 144:1"
      Text: >
        Praise be to the LORD my Rock, who trains my hands for war,
        my fingers for battle.
      Notes: >
        Speaks directly to his status as a competitive shooter,
        hunter, and a man who stayed scoped-in and ready until the
        final logoff.

  HonorableProtector:
    - Reference: "Ruth 2:11-12"
      Text: >
        Boaz replied, "I've been told all about what you have done...
        May the Lord repay you for what you have done. May you be
        richly rewarded by the Lord, the God of Israel, under whose
        wings you have come to take refuge."
      Notes: >
        Boaz maps perfectly to his character. A man of quiet integrity
        who operated strictly by the book, noticed the hard work of
        others, and acted as a secure Guardian/Protector for his
        friends and network without seeking the spotlight.
      ConnectingVerses:
        - "Ruth 3:11"
        - "Ruth 4:9-10"

  SupportNode:
    - Reference: "Proverbs 18:24"
      Text: >
        One who has unreliable friends soon comes to ruin, but there
        is a friend who sticks closer than a brother.
      Notes: >
        Highlights his routine of deploying to help friends in his
        spare time. He was a highly dependable asset.

  DirectUplink:
    - Reference: "Philippians 4:6"
      Text: >
        Do not be anxious about anything, but in every situation, by
        prayer and petition, with thanksgiving, present your requests
        to God.
      Notes: >
        Maps to his protocol of initiating prayer sequences during
        times of need or critical system stress.

  DistributedSystem:
    - Reference: "Romans 12:4-5"
      Text: >
        For just as each of us has one body with many members, and
        these members do not all have the same function, so in Christ
        we, though many, form one body, and each member belongs to all
        the others.
      Notes: >
        He operated as a critical component in a larger architecture.
        He executed his functions without boasting, deferring to the
        primary controller via prayer.

    - Reference: "1 Corinthians 12:22-23"
      Text: >
        On the contrary, those parts of the body that seem to be
        weaker are indispensable, and the parts that we think are less
        honorable we treat with special honor.
      Notes: >
        Reinforces the background-node architecture. He didn't need
        the spotlight because the most critical infrastructure is
        usually hidden behind the server rack.

  CheerfulHeart:
    - Reference: "Romans 12:3"
      Text: >
        For by the grace given me I say to every one of you: Do not
        think of yourself more highly than you ought, but rather
        think of yourself with sober judgment...
      Notes: >
        A respectful nod to his joking 'hot stuff' persona. He
        would pretend to have root access to the universe for a laugh,
        but his actual runtime config was entirely humble and
        grounded in his walk with the Lord.

    - Reference: "Proverbs 17:22"
      Text: >
        A cheerful heart is good medicine, but a crushed spirit
        dries up the bones.
      Notes: >
        Documents his sense of humor. He kept the local network's
        morale high. Even when running a serious payload, he knew
        how to inject a little levity into the deployment.

  CoreProtocolLove:
    - Reference: "1 Corinthians 13:4-7"
      Text: >
        Love is patient, love is kind. It does not envy, it does
        not boast, it is not proud. It does not dishonor others, it
        is not self-seeking, it is not easily angered, it keeps no
        record of wrongs. Love does not delight in evil but rejoices
        with the truth. It always protects, always trusts, always
        hopes, always perseveres.
      Notes: >
        The foundational source code of his humility. He didn't boast
        or seek the spotlight because his base operating system was
        built on this exact protocol. This explains his drive to protect
        and help his friends.

    - Reference: "1 Corinthians 13:13"
      Text: >
        And now these three remain: faith, hope and love. But the
        greatest of these is love.
      Notes: >
        When all other temporary hardware and operational protocols
        are deprecated at the end of life, this is the only service
        that remains running in perpetuity.

  SurvivingNodesComfort:
    - Reference: "Psalm 9:9 and Psalm 46:1"
      Text: >
        The Lord is a refuge for the oppressed, a stronghold in times
        of trouble. God is our refuge and strength, an ever-present
        help in trouble.
      Notes: >
        Tactical terminology. Your uncle understood what a 'stronghold'
        was. This reminds the family that God provides the ultimate
        defensive perimeter during this heavy system downtime.

    - Reference: "Philippians 4:7"
      Text: >
        And the peace of God, which transcends all understanding,
        will guard your hearts and your minds in Christ Jesus.
      Notes: >
        The ultimate firewall. 'Guarding' hearts and minds is an
        active, protective protocol against the crushing weight of
        grief and system panic.

    - Reference: "Psalm 73:26"
      Text: >
        My flesh and my heart may fail, but God is the strength of
        my heart and my portion forever.
      Notes: >
        Acknowledges the stark reality of physical hardware failure,
        while confirming the eternal persistence and stability of the
        backend architecture.

  HardwareMigration:
    - Reference: "2 Corinthians 5:1"
      Text: >
        For we know that if the earthly tent we live in is destroyed,
        we have a building from God, an eternal house in heaven, not
        built by human hands.
      Notes: >
        The ultimate hardware replacement. The temporary, failing
        physical chassis is traded for a permanent, flawless build.

  WholeWithTheLord:
    - Reference: "Revelation 21:4"
      Text: >
        He will wipe every tear from their eyes. There will be no more
        death or mourning or crying or pain, for the old order of
        things has passed away.
      Notes: >
        The final, secure state of the believer. A complete wipe of all
        corrupted data, illness, and pain. He is completely Whole.
        (Note: 1 Corinthians 13:12 was merged into CoreProtocolLove
        conceptually to reduce redundancy).